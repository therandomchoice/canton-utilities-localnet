---
x-vars:
  log_warning_if_party_hint_undefined: ${PARTY_HINT:?PARTY_HINT is required of format <company>-<role>-<number>}

  app-provider-auth-env: &app-provider-auth-env
    path: ${APP_PROVIDER_AUTH_ENV}
    required: false

  app-user-auth-env: &app-user-auth-env
    path: ${APP_USER_AUTH_ENV}
    required: false

  sv-auth-env: &sv-auth-env
    path: ${SV_AUTH_ENV}
    required: false

  alpha-protocol-version-env: &alpha-protocol-version-env
    path: ${ALPHA_PROTOCOL_VERSION_ENV}
    required: false

volumes:
  postgres:
  domain-upgrade-dump:

networks:
  default:
    name: ${DOCKER_NETWORK}
    driver: bridge

services:
  ###############################################################################################################
  ### Common Services
  ###############################################################################################################
  postgres:
    image: "postgres:${POSTGRES_VERSION}"
    container_name: postgres
    volumes:
      # Postgres 18 and above
      - postgres:/var/lib/postgresql
      # Postgres 17 and below. Replace the volume above with this one if you haven't yet upgraded to Postgres >=18.
      #- postgres:/var/lib/postgresql/data
      - ${LOCALNET_DIR}/docker/postgres/postgres-entrypoint.sh:/postgres-entrypoint.sh
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - ${LOCALNET_ENV_DIR}/postgres.env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-$DB_PORT:}5432"
    entrypoint: /postgres-entrypoint.sh
    healthcheck:
      test: "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER} -d postgres"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    user: "postgres"
    command:
      - postgres
      - -c
      - max_connections=1000
    profiles:
      - app-provider
      - app-user
      - sv
      - multi-sync

  nginx:
    image: "nginx/nginx-unprivileged:${NGINX_VERSION}"
    container_name: nginx
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
    volumes:
      - ${LOCALNET_DIR}/conf/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ${LOCALNET_DIR}/conf/nginx/app-provider.conf:/etc/nginx/templates/app-provider.c${APP_PROVIDER_PROFILE}f.template
      - ${LOCALNET_DIR}/conf/nginx/app-user.conf:/etc/nginx/templates/app-user.c${APP_USER_PROFILE}f.template
      - ${LOCALNET_DIR}/conf/nginx/sv.conf:/etc/nginx/templates/sv.c${SV_PROFILE}f.template
      - ${LOCALNET_DIR}/conf/nginx/swagger-ui:/etc/nginx/includes
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${SV_UI_PORT}:${SV_UI_PORT}"
      - "${HOST_BIND_IP:-127.0.0.1}:${APP_PROVIDER_UI_PORT}:${APP_PROVIDER_UI_PORT}"
      - "${HOST_BIND_IP:-127.0.0.1}:${APP_USER_UI_PORT}:${APP_USER_UI_PORT}"
    depends_on:
      wallet-web-ui-sv:
        condition: service_healthy
        required: false
      wallet-web-ui-app-provider:
        condition: service_healthy
        required: false
      wallet-web-ui-app-user:
        condition: service_healthy
        required: false
      utility-ui-sv:
        condition: service_started
        required: false
      utility-ui-app-provider:
        condition: service_started
        required: false
      utility-ui-app-user:
        condition: service_started
        required: false
      hosted-backend-sv:
        condition: service_started
        required: false
      splice:
        condition: service_healthy
    restart: always
    profiles:
      - app-provider
      - app-user
      - sv

  canton:
    image: "${IMAGE_REPO}canton:${IMAGE_TAG}"
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *app-provider-auth-env
      - *app-user-auth-env
      - *sv-auth-env
      - *alpha-protocol-version-env
    container_name: canton
    volumes:
      - ${LOCALNET_DIR}/docker/canton/health-check.sh:/app/health-check.sh
      - ${LOCALNET_DIR}/conf/canton/app.conf:/app/app.conf
      - ${LOCALNET_DIR}/conf/canton/app-provider:/app/app-provider/${APP_PROVIDER_PROFILE}
      - ${LOCALNET_DIR}/conf/canton/app-user:/app/app-user/${APP_USER_PROFILE}
      - ${LOCALNET_DIR}/conf/canton/sv:/app/sv/${SV_PROFILE}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-4$PARTICIPANT_LEDGER_API_PORT_SUFFIX:}4${PARTICIPANT_LEDGER_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-4$PARTICIPANT_ADMIN_API_PORT_SUFFIX:}4${PARTICIPANT_ADMIN_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-4$PARTICIPANT_JSON_API_PORT_SUFFIX:}4${PARTICIPANT_JSON_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-3$PARTICIPANT_LEDGER_API_PORT_SUFFIX:}3${PARTICIPANT_LEDGER_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-3$PARTICIPANT_ADMIN_API_PORT_SUFFIX:}3${PARTICIPANT_ADMIN_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-3$PARTICIPANT_JSON_API_PORT_SUFFIX:}3${PARTICIPANT_JSON_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-2$PARTICIPANT_LEDGER_API_PORT_SUFFIX:}2${PARTICIPANT_LEDGER_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-2$PARTICIPANT_ADMIN_API_PORT_SUFFIX:}2${PARTICIPANT_ADMIN_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-2$PARTICIPANT_JSON_API_PORT_SUFFIX:}2${PARTICIPANT_JSON_API_PORT_SUFFIX}"
    healthcheck:
      test: ["CMD", "bash", "/app/health-check.sh"]
      interval: 20s
      start_interval: 5s
      timeout: 30s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    profiles:
      - app-provider
      - app-user
      - sv
      - multi-sync

  splice:
    image: "${IMAGE_REPO}splice-app:${IMAGE_TAG}"
    container_name: splice
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - ${LOCALNET_ENV_DIR}/splice.env
      - *app-provider-auth-env
      - *app-user-auth-env
      - *sv-auth-env
    environment:
      - CANTON_PROTOCOL_VERSION
    volumes:
      - ${LOCALNET_DIR}/docker/splice/health-check.sh:/app/health-check.sh
      - ${LOCALNET_DIR}/conf/splice/app.conf:/app/app.conf
      - ${LOCALNET_DIR}/conf/splice/app-provider:/app/app-provider/${APP_PROVIDER_PROFILE}
      - ${LOCALNET_DIR}/conf/splice/app-user:/app/app-user/${APP_USER_PROFILE}
      - ${LOCALNET_DIR}/conf/splice/sv:/app/sv/${SV_PROFILE}
      - domain-upgrade-dump:/domain-upgrade-dump
    healthcheck:
      test: ["CMD", "bash", "/app/health-check.sh"]
      interval: 20s
      start_interval: 5s
      timeout: 40s
      retries: 1000
      start_period: 30s
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-4$VALIDATOR_ADMIN_API_PORT_SUFFIX:}4${VALIDATOR_ADMIN_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-3$VALIDATOR_ADMIN_API_PORT_SUFFIX:}3${VALIDATOR_ADMIN_API_PORT_SUFFIX}"
      - "${HOST_BIND_IP:-127.0.0.1}:${TEST_PORT-2$VALIDATOR_ADMIN_API_PORT_SUFFIX:}2${VALIDATOR_ADMIN_API_PORT_SUFFIX}"
    depends_on:
      canton:
        condition: service_healthy
    restart: always
    profiles:
      - app-provider
      - app-user
      - sv
      - multi-sync

  console:
    build:
      context: ${LOCALNET_DIR}/docker/console
      args:
        BASE_IMAGE: ${IMAGE_REPO}canton:${IMAGE_TAG}
    environment:
      - MULTI_SYNC=false
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *app-provider-auth-env
      - *app-user-auth-env
      - *sv-auth-env
    volumes:
      - ${LOCALNET_DIR}/conf/console/app.conf:/app/app.conf
      - ${LOCALNET_DIR}/conf/console/app-synchronizer.sc:/app/app-synchronizer.sc
      - ${LOCALNET_DIR}/conf/console/app-provider:/app/app-provider/${APP_PROVIDER_PROFILE}
      - ${LOCALNET_DIR}/conf/console/app-user:/app/app-user/${APP_USER_PROFILE}
      - ${LOCALNET_DIR}/conf/console/sv:/app/sv/${SV_PROFILE}
      - ${LOCALNET_DIR}/docker/console/entrypoint.sh:/app/entrypoint.sh
    entrypoint: /app/entrypoint.sh
    stdin_open: true
    tty: true
    profiles:
      - console

  multi-sync-startup:
    extends:
      service: console
    container_name: multi-sync-startup
    environment:
      - MULTI_SYNC=true
    depends_on:
      splice:
        condition: service_healthy
    profiles:
      - multi-sync

  multi-sync-ready:
    container_name: multi-sync-ready
    image: busybox:1.37.0
    depends_on:
      multi-sync-startup:
        condition: service_completed_successfully
    profiles:
      - multi-sync

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    environment:
      URLS: '[{"url": "http://canton.localhost:${APP_PROVIDER_UI_PORT}/docs/openapi", "name": "app-provider"},
              {"url": "http://canton.localhost:${APP_USER_UI_PORT}/docs/openapi", "name": "app-user"},
              {"url": "http://canton.localhost:${SV_UI_PORT}/docs/openapi", "name": "sv"}]'
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${SWAGGER_UI_PORT}:8080"
    profiles:
      - swagger-ui

  ###############################################################################################################
  ### Application User
  ###############################################################################################################
  wallet-web-ui-app-user:
    image: "${IMAGE_REPO}wallet-web-ui:${IMAGE_TAG}"
    container_name: wallet-web-ui-app-user
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *app-user-auth-env
    profiles:
      - app-user

  ans-web-ui-app-user:
    image: "${IMAGE_REPO}ans-web-ui:${IMAGE_TAG}"
    container_name: ans-web-ui-app-user
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *app-user-auth-env
    environment:
      - SPLICE_APP_WALLET_REDIRECT=http://wallet.localhost:${APP_USER_UI_PORT}
    profiles:
      - app-user

  ###############################################################################################################
  ### Application Provider
  ###############################################################################################################
  wallet-web-ui-app-provider:
    image: "${IMAGE_REPO}wallet-web-ui:${IMAGE_TAG}"
    container_name: wallet-web-ui-app-provider
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *app-provider-auth-env
    profiles:
      - app-provider

  ans-web-ui-app-provider:
    image: "${IMAGE_REPO}ans-web-ui:${IMAGE_TAG}"
    container_name: ans-web-ui-app-provider
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *app-provider-auth-env
    environment:
      - SPLICE_APP_WALLET_REDIRECT=http://wallet.localhost:${APP_PROVIDER_UI_PORT}
    profiles:
      - app-provider

  ###############################################################################################################
  ### SUPER VALIDATOR
  ###############################################################################################################
  wallet-web-ui-sv:
    image: "${IMAGE_REPO}wallet-web-ui:${IMAGE_TAG}"
    container_name: wallet-web-ui-sv
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *sv-auth-env
    profiles:
      - sv

  sv-web-ui:
    image: "${IMAGE_REPO}sv-web-ui:${IMAGE_TAG}"
    container_name: sv-web-ui
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *sv-auth-env
    profiles:
      - sv

  scan-web-ui:
    image: "${IMAGE_REPO}scan-web-ui:${IMAGE_TAG}"
    container_name: scan-web-ui
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *sv-auth-env
    profiles:
      - sv

  ###############################################################################################################
  ### Utilities - Application User
  ###############################################################################################################
  utility-ui-app-user:
    image: "${UTILITIES_IMAGE_REPO}/frontend:${UTILITIES_IMAGE_VERSION}"
    container_name: utility-ui-app-user
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *app-user-auth-env
    environment:
      - UTILITY_APP_CONFIG_TEMPLATE=config.js.hs256.template
      - AUTH_AUDIENCE=https://canton.network.global
      - UTILITY_APP_UTILITY_BACKEND_URL=http://utility.localhost:${APP_USER_UI_PORT}
    profiles:
      - app-user

  darsyncer-app-user:
    image: "${UTILITIES_IMAGE_REPO}/utilities-darsyncer-client:${UTILITIES_IMAGE_VERSION}"
    container_name: darsyncer-app-user
    command:
      - --endpoint=canton:2${PARTICIPANT_ADMIN_API_PORT_SUFFIX}
    environment:
      - DARS=/dars
      - CLIENT_ID=unsafe
      - CLIENT_SECRET=unsafe
      - OAUTH_DOMAIN=
    depends_on:
      canton:
        condition: service_healthy
      splice:
        condition: service_healthy
    profiles:
      - app-user

  ###############################################################################################################
  ### Utilities - Application Provider
  ###############################################################################################################
  utility-ui-app-provider:
    image: "${UTILITIES_IMAGE_REPO}/frontend:${UTILITIES_IMAGE_VERSION}"
    container_name: utility-ui-app-provider
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *app-provider-auth-env
    environment:
      - UTILITY_APP_CONFIG_TEMPLATE=config.js.hs256.template
      - AUTH_AUDIENCE=https://canton.network.global
      - UTILITY_APP_UTILITY_BACKEND_URL=http://utility.localhost:${APP_PROVIDER_UI_PORT}
    profiles:
      - app-provider

  darsyncer-app-provider:
    image: "${UTILITIES_IMAGE_REPO}/utilities-darsyncer-client:${UTILITIES_IMAGE_VERSION}"
    container_name: darsyncer-app-provider
    command:
      - --endpoint=canton:3${PARTICIPANT_ADMIN_API_PORT_SUFFIX}
    environment:
      - DARS=/dars
      - CLIENT_ID=unsafe
      - CLIENT_SECRET=unsafe
      - OAUTH_DOMAIN=
    depends_on:
      canton:
        condition: service_healthy
      splice:
        condition: service_healthy
    profiles:
      - app-provider

  ###############################################################################################################
  ### Utilities - Super Validator: UI, and the operator's PQS + hosted-backend that serve the whole network
  ###############################################################################################################
  utility-ui-sv:
    image: "${UTILITIES_IMAGE_REPO}/frontend:${UTILITIES_IMAGE_VERSION}"
    container_name: utility-ui-sv
    env_file:
      - ${LOCALNET_ENV_DIR}/common.env
      - *sv-auth-env
    environment:
      - UTILITY_APP_CONFIG_TEMPLATE=config.js.hs256.template
      - AUTH_AUDIENCE=https://canton.network.global
      - UTILITY_APP_UTILITY_BACKEND_URL=http://utility.localhost:${SV_UI_PORT}
    profiles:
      - sv

  pqs-sv:
    image: "${PQS_IMAGE_REPO}/participant-query-store:${PQS_VERSION}"
    container_name: pqs-sv
    command: ["pipeline", "ledger", "postgres-document"]
    environment:
      - PQS_SOURCE_LEDGER_HOST=canton
      - PQS_SOURCE_LEDGER_PORT=4${PARTICIPANT_LEDGER_API_PORT_SUFFIX}
      - PQS_SOURCE_LEDGER_AUTH=OAuth
      - PQS_PIPELINE_OAUTH_ACCESSTOKEN=${PQS_LEDGER_API_TOKEN}
      - PQS_PIPELINE_LEDGER_START=Oldest
      # hosted-backend reads created-event blobs (metadata) for disclosed contracts
      - PQS_PIPELINE_FILTER_METADATA=*
      - PQS_TARGET_POSTGRES_HOST=postgres
      - PQS_TARGET_POSTGRES_PORT=5432
      - PQS_TARGET_POSTGRES_DATABASE=pqs-sv
      - PQS_TARGET_POSTGRES_USERNAME=${DB_USER}
      - PQS_TARGET_POSTGRES_PASSWORD=${DB_PASSWORD}
      - PQS_HEALTH_ADDRESS=0.0.0.0
      - PQS_HEALTH_PORT=8080
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && read -r l <&3 && [[ $$l == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      splice:
        condition: service_healthy
    restart: on-failure
    profiles:
      - sv

  hosted-backend-sv:
    image: "${UTILITIES_IMAGE_REPO}/hosted-backend:${UTILITIES_BACKEND_VERSION}"
    container_name: hosted-backend-sv
    environment:
      - OPERATOR_PQS_HOST=postgres
      - OPERATOR_PQS_PORT=5432
      - OPERATOR_PQS_DB=pqs-sv
      - OPERATOR_PQS_USER=${DB_USER}
      - OPERATOR_PQS_PASSWORD=${DB_PASSWORD}
      - PQS_SCHEMA=public
      - PQS_HISTORICAL_HOST=postgres
      - PQS_HISTORICAL_PORT=5432
      - PQS_HISTORICAL_DB=pqs-sv
      - PQS_HISTORICAL_USER=${DB_USER}
      - PQS_HISTORICAL_PASSWORD=${DB_PASSWORD}
      - PQS_HISTORICAL_SCHEMA=public
      - OPERATOR_LEDGER_API_HOST=canton
      - OPERATOR_LEDGER_API_PORT=4${PARTICIPANT_LEDGER_API_PORT_SUFFIX}
      - OPERATOR_ADMIN_API_HOST=canton
      - OPERATOR_ADMIN_API_PORT=4${PARTICIPANT_ADMIN_API_PORT_SUFFIX}
      - VALIDATOR_URL=splice:4${VALIDATOR_ADMIN_API_PORT_SUFFIX}
      # Ledger API auth: HS256 "unsafe" tokens for ledger-api-user with the participants' audience
      - UTILITY_OPERATOR_USER=ledger-api-user
      - USER_VALIDATOR_LEDGER_API_USER=ledger-api-user
      - SERVICE_ACCOUNT_AUDIENCE=https://canton.network.global
      - JSON_API_URL=canton:4${PARTICIPANT_JSON_API_PORT_SUFFIX}
      # Utilities operator party on the sv participant, allocated by `make up` (tools/party-ids.sh)
      - OPERATOR_PARTY_ID=${UTILITY_OPERATOR_PARTY_ID:-operator}
    depends_on:
      pqs-sv:
        condition: service_healthy
      canton:
        condition: service_healthy
      splice:
        condition: service_healthy
    profiles:
      - sv

  darsyncer-sv:
    image: "${UTILITIES_IMAGE_REPO}/utilities-darsyncer-client:${UTILITIES_IMAGE_VERSION}"
    container_name: darsyncer-sv
    command:
      - --endpoint=canton:4${PARTICIPANT_ADMIN_API_PORT_SUFFIX}
    environment:
      - DARS=/dars
      - CLIENT_ID=unsafe
      - CLIENT_SECRET=unsafe
      - OAUTH_DOMAIN=
    depends_on:
      canton:
        condition: service_healthy
      splice:
        condition: service_healthy
    profiles:
      - sv

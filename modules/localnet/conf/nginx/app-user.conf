server {
  listen ${APP_USER_UI_PORT};
  server_name ans.localhost;
  location /api/validator {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:2${VALIDATOR_ADMIN_API_PORT_SUFFIX}/api/validator;
  }
  location / {
    proxy_pass http://ans-web-ui-app-user:8080/;
  }
}

# Deprecated, use json-ledger-api.localhost instead
server {
  listen ${APP_USER_UI_PORT};
  server_name canton.localhost;
  location / {
    proxy_pass http://canton:2${PARTICIPANT_JSON_API_PORT_SUFFIX};
    include /etc/nginx/includes/cors-headers.conf;
  }
}

server {
  listen ${APP_USER_UI_PORT};
  server_name json-ledger-api.localhost;
  location / {
    proxy_pass http://canton:2${PARTICIPANT_JSON_API_PORT_SUFFIX};
    include /etc/nginx/includes/cors-headers.conf;
  }
}

server {
  listen ${APP_USER_UI_PORT} http2;
  server_name grpc-ledger-api.localhost;
  location / {
    grpc_pass grpc://canton:2${PARTICIPANT_LEDGER_API_PORT_SUFFIX};
  }
}

server {
  listen ${APP_USER_UI_PORT};
  server_name localhost wallet.localhost;

  # Reverse proxy for /api/validator
  location /api/validator {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:2${VALIDATOR_ADMIN_API_PORT_SUFFIX}/api/validator;
  }

  # Reverse proxy to wallet-web-ui
  location / {
    proxy_pass http://wallet-web-ui-app-user:8080/;
  }
}

server {
  listen ${APP_USER_UI_PORT};
  server_name utility.localhost;

  location /api/validator {
    rewrite ^\/(.*)$ /$1 break;
    proxy_pass http://splice:2${VALIDATOR_ADMIN_API_PORT_SUFFIX}/api/validator;
  }

  location /api/json-api/ {
    proxy_pass http://canton:2${PARTICIPANT_JSON_API_PORT_SUFFIX}/;
    # WebSocket streams of the JSON Ledger API (the Utilities UI reads the ACS over /v2/state/active-contracts)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 1h;
  }

  # Utilities API and Token Standard registry API: the operator's hosted-backend on sv serves the
  # whole network, like api.utilities.digitalasset.com on DevNet/MainNet
  location /api/utilities/ {
    # resolve per request: hosted-backend gets a new IP whenever it is recreated
    resolver 127.0.0.11 valid=10s;
    set $hosted_backend hosted-backend-sv;
    proxy_pass http://$hosted_backend:8080;
  }

  location /api/token-standard/ {
    # resolve per request: hosted-backend gets a new IP whenever it is recreated
    resolver 127.0.0.11 valid=10s;
    set $hosted_backend hosted-backend-sv;
    proxy_pass http://$hosted_backend:8080;
  }

  location / {
    proxy_pass http://utility-ui-app-user:8080/;
  }
}

# utilities.localhost is a common typo of utility.localhost; without this it falls through to the default server
server {
  listen ${APP_USER_UI_PORT};
  server_name utilities.localhost;
  return 301 http://utility.localhost:${APP_USER_UI_PORT}$request_uri;
}

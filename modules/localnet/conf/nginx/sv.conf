server {
  listen ${SV_UI_PORT};
  server_name localhost _;

  location = /status {
    stub_status;
  }

  # Serve static files from /usr/share/nginx/html
  location / {
    root /usr/share/nginx/sv-html;
    try_files $uri $uri/ =404;
  }

  client_max_body_size 10M;
  keepalive_timeout 65;
}

server {
  listen ${SV_UI_PORT};
  server_name sv.localhost;

  location /api/sv {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:5014/api/sv;
  }
  location / {
    proxy_pass http://sv-web-ui:8080/;
  }
}

server {
  listen ${SV_UI_PORT};
  server_name scan.localhost;

  location /api/scan {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:5012/api/scan;
  }
  location /registry {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:5012/registry;
  }
  location / {
    proxy_pass http://scan-web-ui:8080/;
  }
}

server {
  listen ${SV_UI_PORT};
  server_name wallet.localhost;

  # Reverse proxy for /api/validator
  location /api/validator {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:4${VALIDATOR_ADMIN_API_PORT_SUFFIX}/api/validator;
  }

  # Reverse proxy to wallet-web-ui
  location / {
    proxy_pass http://wallet-web-ui-sv:8080/;
  }
}

server {
  listen ${SV_UI_PORT};
  server_name canton.localhost;
  location /docs/openapi {
    proxy_pass http://canton:4${PARTICIPANT_JSON_API_PORT_SUFFIX}/docs/openapi;
    include /etc/nginx/includes/cors-headers.conf;
  }

  location /v2 {
    include /etc/nginx/includes/cors-options-headers.conf;
    proxy_pass http://canton:4${PARTICIPANT_JSON_API_PORT_SUFFIX}/v2;
    include /etc/nginx/includes/cors-headers.conf;
  }
}

server {
  listen ${SV_UI_PORT};
  server_name utility.localhost;

  location /api/validator {
    rewrite ^\/(.*)$ /$1 break;
    proxy_pass http://splice:4${VALIDATOR_ADMIN_API_PORT_SUFFIX}/api/validator;
  }

  location /api/json-api/ {
    proxy_pass http://canton:4${PARTICIPANT_JSON_API_PORT_SUFFIX}/;
    # WebSocket streams of the JSON Ledger API (the Utilities UI reads the ACS over /v2/state/active-contracts)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 1h;
  }

  location /api/utilities/ {
    # resolve per request: hosted-backend gets a new IP whenever it is recreated
    resolver 127.0.0.11 valid=10s;
    set $hosted_backend hosted-backend-sv;
    proxy_pass http://$hosted_backend:8080;
  }

  location /api/token-standard/ {
    # resolve per request: hosted-backend gets a new IP whenever it is recreated
    resolver 127.0.0.11 valid=10s;
    set $hosted_backend hosted-backend-sv;
    proxy_pass http://$hosted_backend:8080;
  }

  location / {
    proxy_pass http://utility-ui-sv:8080/;
  }
}

# utilities.localhost is a common typo of utility.localhost; without this it falls through to the default server
server {
  listen ${SV_UI_PORT};
  server_name utilities.localhost;
  return 301 http://utility.localhost:${SV_UI_PORT}$request_uri;
}
